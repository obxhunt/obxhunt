name: Weekly Top Picks email
# Started every Sunday at 8am Eastern by cron-job.org (GitHub's own scheduler proved unreliable,
# and having both would risk sending the email twice). Can also be started by hand.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock nodemailer@6.9.16
      - run: node tools/top-picks.mjs
        env:
          FAMILY_CODE: ${{ secrets.FAMILY_CODE }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
